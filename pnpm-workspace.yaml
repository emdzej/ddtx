packages:
  - "packages/*"
  # Nested one level deeper than the rest: `packages/*` matches `packages/plugins`,
  # which is a container rather than a package, and misses the plugins inside it.
  - "packages/plugins/*"
  - "apps/*"
  - "tools/*"

# serialport ships a native binding; without this pnpm skips its build script and
# `require('serialport')` fails at run time with a missing-binding error.
onlyBuiltDependencies:
  - "@serialport/bindings-cpp"
