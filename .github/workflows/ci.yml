name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nothing here is worth finishing for a commit that
# has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose — `packageManager` in package.json is the single
      # source of the pnpm version, and setting both makes the action error on the
      # conflict.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        # Covers the workspace *and* apps/web, which type-checks through svelte-check
        # against a different tsconfig. Running only the root check misses the web app
        # entirely — that is how a missing import once passed and crashed at runtime.
        run: pnpm typecheck

      - name: Build plugins
        run: pnpm plugins:build

      - name: Plugins declare no WebAssembly imports
        # The property the whole plugin sandbox rests on, asserted as its own step so a
        # regression is obvious in the checks list rather than buried in bundler output.
        run: node tools/check-plugin-imports.mjs

      - name: Test
        # `pnpm test`, not `test:db`. The ECU database is not redistributable and `data/`
        # is git-ignored, so the tree-backed suites have nothing to run against and skip
        # themselves — as do the browser suites, which need a dev server and the archive.
        # What runs is everything needing neither: the codec against its golden vectors,
        # the driver against its mock, the plugin loop, and every compiled plugin module.
        run: pnpm test

      - name: Build the web app
        run: pnpm web:build

      # Kept so a PR can be checked by hand without building it locally. Short retention:
      # this is a debugging aid, not a distribution channel — releases are that.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
