name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Not cancel-in-progress: a half-finished deploy would leave the site in whatever state
# the cancelled run reached. Queueing is the right behaviour for a publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build plugins
        # Bundled into the app's public/ and discovered at runtime from
        # plugins/index.json, so the deployed site carries all fourteen.
        run: pnpm plugins:build

      - name: Build the translation bundle
        # `i18n/en/bundle.json` is generated, not tracked, so it has to be built here.
        # Deliberately not tolerant of failure: without it the site ships no translations
        # and the failure is *silent* — the overlay falls back to the original French,
        # which reads as untranslated work rather than a broken deploy. It needs no
        # database, only the authored sources under `i18n/source/`.
        run: pnpm i18n:build

      - name: Work out the base path
        id: base
        # A custom domain serves the site at the **root**; the default
        # `<user>.github.io/<repo>/` serves it under a prefix. `base` is baked in at
        # build time and a build cannot be relocated afterwards, so this has to be
        # decided here and it has to be right.
        #
        # `apps/web/public/CNAME` is the signal, because it is the same file GitHub reads
        # to keep the custom domain attached. One fact, one place — and a fork with no
        # CNAME still gets a working prefixed build.
        run: |
          set -euo pipefail
          if [ -f apps/web/public/CNAME ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "custom domain $(cat apps/web/public/CNAME) — building for the root"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
            echo "no CNAME — building for /${{ github.event.repository.name }}/"
          fi

      - name: Build the web app
        env:
          # Vite's `base` comes from this, and every runtime fetch — plugins,
          # translations, the database URL default — goes through
          # `import.meta.env.BASE_URL`, so nothing is hardcoded either way.
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: pnpm web:build

      # The deployed site ships **no ECU database**, deliberately. It is 1.19 GB
      # unpacked and not ours to redistribute. That is workable because the app can now
      # install one itself: a visitor picks their own `ecu.zip` and it is unpacked into
      # their browser's private filesystem. See docs/database-install.md.
      #
      # So a fresh visit lands on the picker, and the VIN CRC calculator works
      # immediately because it needs no vehicle and no database.
      - name: Check the build is self-contained and correctly based
        run: |
          set -euo pipefail
          BASE='${{ steps.base.outputs.path }}'
          test -f apps/web/dist/index.html
          test -f apps/web/dist/plugins/index.json
          test -f apps/web/dist/i18n/en/bundle.json
          echo "plugins: $(node -e 'console.log(require("./apps/web/dist/plugins/index.json").length)')"

          # The failure this catches is nasty because index.html still returns 200: the
          # page loads and every asset 404s. That is exactly what shipping a /ddtx/ build
          # to a root domain did.
          if ! grep -q "src=\"${BASE}assets/" apps/web/dist/index.html; then
            echo "index.html does not reference assets under ${BASE}:" >&2
            grep -oE '(src|href)="[^"]*assets[^"]*"' apps/web/dist/index.html >&2
            exit 1
          fi
          echo "assets are referenced under ${BASE}"

          # A CNAME in the artifact is what keeps the custom domain attached.
          if [ -f apps/web/public/CNAME ]; then
            test -f apps/web/dist/CNAME
            echo "CNAME deployed: $(cat apps/web/dist/CNAME)"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
